apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: distributed-ledger
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@postgres-service.distributed-ledger.svc.cluster.local:5432/ledger_db?sslmode=disable"
  JWT_SECRET: "k8s-production-jwt-secret-key-32b-placeholder"
  ADMIN_SECRET: "k8s-production-admin-secret-dev-key"
  WEBHOOK_SECRET: "k8s-production-webhook-shared-secret-key"
