apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-network-policy
  namespace: distributed-ledger
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # 1. Gateway Ingress: Accept HTTP from Ingress Controller on Port 8000
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

    # 2. Core Ledger Ingress: Allow gRPC (9101) strictly from Gateway & Fraud Engine
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-service
      ports:
        - protocol: TCP
          port: 9101

    # 3. Prometheus Scrape Ingress: Allow metrics scrape on respective ports
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9111
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
